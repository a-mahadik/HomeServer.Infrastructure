name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    runs-on: self-hosted
    env:
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Start ssh-agent
        run: |
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            mkdir -p ~/.ssh
            ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
            echo "Generated a new SSH key. Authorize this public key for root on the Proxmox host:"
            echo "  echo \"$(cat ~/.ssh/id_ed25519.pub)\" >> /root/.ssh/authorized_keys"
          fi
          pkill -f "ssh-agent.*$SSH_AUTH_SOCK" 2>/dev/null || true
          rm -f "$SSH_AUTH_SOCK"
          ssh-agent -a "$SSH_AUTH_SOCK"
          ssh-add ~/.ssh/id_ed25519

      - name: Generate terraform.tfvars
        shell: bash
        run: |
          cat > terraform.tfvars <<'EOF'
          proxmox_endpoint  = "${{ secrets.PROXMOX_ENDPOINT }}"
          proxmox_api_token = "${{ secrets.PROXMOX_TF_TOKEN }}"
          proxmox_ssh_username = "${{ secrets.PROXMOX_SSH_USER }}"
          proxmox_ssh_private_key = "${{ secrets.PROXMOX_SSH_KEY_PATH }}"
          EOF

      - name: Terraform Init
        run: |
          mkdir -p "$HOME/tf-state"
          terraform init -input=false -reconfigure \
            -backend-config="path=$HOME/tf-state/homeserver-infra.tfstate"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Import (drift reconciliation)
        run: |
          ADDR='module.kube["kube-ctrl"].proxmox_virtual_environment_vm.this[0]'
          if ! terraform state list | grep -qF -- "$ADDR"; then
            echo "Importing existing VM 1001 into state..."
            terraform import "$ADDR" 'pve/1001'
          else
            echo "Already in state, skipping import."
          fi

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
