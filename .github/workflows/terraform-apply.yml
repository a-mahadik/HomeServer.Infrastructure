name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    runs-on: self-hosted
    env:
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Start ssh-agent
        run: |
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            mkdir -p ~/.ssh
            ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
            echo "Generated a new SSH key. Authorize this public key on the Proxmox host for the terraform user:"
            echo "  echo \"$(cat ~/.ssh/id_ed25519.pub)\" >> /home/terraform/.ssh/authorized_keys"
          fi
          pkill -f "ssh-agent.*$SSH_AUTH_SOCK" 2>/dev/null || true
          rm -f "$SSH_AUTH_SOCK"
          ssh-agent -a "$SSH_AUTH_SOCK"
          ssh-add ~/.ssh/id_ed25519

      - name: Generate terraform.tfvars
        shell: bash
        run: |
          cat > terraform.tfvars <<'EOF'
          proxmox_endpoint  = "${{ secrets.PROXMOX_ENDPOINT }}"
          proxmox_api_token = "${{ secrets.PROXMOX_TF_TOKEN }}"
          proxmox_ssh_username = "terraform"
          EOF

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
